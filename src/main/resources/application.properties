spring.application.name=projeto

# H2 Database (memória)
spring.datasource.url=jdbc:h2:mem:projeto;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security: desabilitar csrf para API stateless inicial
spring.main.allow-bean-definition-overriding=true

# Amazon Product Advertising API configurações
amazon.paapi.endpoint=webservices.amazon.com.br
amazon.paapi.region=us-east-1
amazon.paapi.partnerTag=${AMAZON_PARTNER_TAG:}
amazon.paapi.accessKey=${AMAZON_ACCESS_KEY:}
amazon.paapi.secretKey=${AMAZON_SECRET_KEY:}
amazon.paapi.enabled=${AMAZON_PAAPI_ENABLED:false}

# Debug logging for Amazon integration
logging.level.br.pucpr.projeto.livros.service.AmazonBookLookupService=DEBUG
logging.level.br.pucpr.projeto.livros.service.PriceService=DEBUG
logging.level.br.pucpr.projeto.livros.service.ExternalBookLookupService=DEBUG
