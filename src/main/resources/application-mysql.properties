# MySQL profile properties (activate with --spring.profiles.active=mysql)
spring.datasource.url=jdbc:mysql://localhost:3306/projeto?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=projeto
spring.datasource.password=projeto123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional: disable H2 console when using MySQL
spring.h2.console.enabled=false

# Amazon Product Advertising API configurações para produção
amazon.paapi.endpoint=webservices.amazon.com.br
amazon.paapi.region=us-east-1
amazon.paapi.partner-tag=${AMAZON_PARTNER_TAG:}
amazon.paapi.access-key=${AMAZON_ACCESS_KEY:}
amazon.paapi.secret-key=${AMAZON_SECRET_KEY:}
amazon.paapi.enabled=${AMAZON_PAAPI_ENABLED:true}
